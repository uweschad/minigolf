<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uwe's Minigolf App</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
    font-family: Arial;
    text-align: center;
    margin: 0;
}

table {
    border-collapse: collapse;
    margin: 20px auto;
}

th, td {
    border: 1px solid #333;
    padding: 6px;
    width: 65px;
    text-align: center;
}

input {
    width: 55px;
    text-align: center;
}

.title-input {
    font-size: 22px;
    border: none;
    border-bottom: 2px solid #333;
    outline: none;
    width: 90%;
    max-width: 500px;
}

.lowest {
    background: lightgreen;
}

.highest {
    background: #ff4d4d;
    color: white;
    font-weight: bold;
}

button {
    margin: 10px;
    padding: 10px;
    font-size: 14px;
}

footer {
    margin-top: 20px;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- SETUP -->
<div id="setup">
    <h2>⛳ Spieler auswählen</h2>

    <select id="playerCount">
        <option value="2">2 Spieler</option>
        <option value="3">3 Spieler</option>
        <option value="4" selected>4 Spieler</option>
        <option value="5">5 Spieler</option>
        <option value="6">6 Spieler</option>
    </select>

    <br><br>
    <button onclick="startGame()">Spiel starten</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<input class="title-input" id="courseName" value="Eppelheim" onchange="saveData()">

<h2>⛳ Minigolf Scorekarte</h2>

<table>
<thead id="thead"></thead>
<tbody id="scoreTable"></tbody>
<tfoot id="tfoot"></tfoot>
</table>

<button onclick="shareScreenshot()">📲 Ergebnis teilen</button>

<footer>Uwe‘s Minigolf App (C) 2026</footer>

</div>

<script>

let playerCount = 4;

// START
function startGame() {

    playerCount = parseInt(document.getElementById("playerCount").value);

    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "block";

    let newGame = confirm("Neues Spiel starten?");

    buildTable();

    if (newGame) {
        clearScoresOnly();   // 👈 NUR Punkte löschen, NICHT Namen
    } else {
        loadData();
    }

    calcSum();
}

// TABLE
function buildTable() {

    let thead = "<tr><th>Bahn</th>";
    for (let i = 1; i <= playerCount; i++) {
        thead += `<th><input onchange="saveData()"></th>`;
    }
    thead += "</tr>";
    document.getElementById("thead").innerHTML = thead;

    let body = "";
    for (let i = 1; i <= 18; i++) {
        body += "<tr><td>" + i + "</td>";

        for (let j = 1; j <= playerCount; j++) {
            body += `<td>
                <input type="number" oninput="calcSum(); saveData()">
            </td>`;
        }

        body += "</tr>";
    }

    document.getElementById("scoreTable").innerHTML = body;

    let foot = "<tr><td>Summe</td>";
    for (let i = 1; i <= playerCount; i++) {
        foot += `<td id="sum${i}">36</td>`;
    }
    foot += "</tr>";

    foot += "<tr><td>Ø</td>";
    for (let i = 1; i <= playerCount; i++) {
        foot += `<td id="avg${i}">0</td>`;
    }
    foot += "</tr>";

    document.getElementById("tfoot").innerHTML = foot;
}

// 🧹 NUR SPIELSTAND LÖSCHEN
function clearScoresOnly() {

    document.querySelectorAll("#scoreTable input").forEach(i => i.value = "");

    for (let i = 1; i <= playerCount; i++) {
        document.getElementById("sum" + i).innerText = "36";
        document.getElementById("avg" + i).innerText = "0";
    }
}

// SUMME + DURCHSCHNITT
function calcSum() {

    let sums = Array(playerCount).fill(36);
    let counts = Array(playerCount).fill(0);

    document.querySelectorAll("#scoreTable tr").forEach(row => {

        let inputs = row.querySelectorAll("input");

        inputs.forEach((input, i) => {

            let v = parseInt(input.value);
            if (isNaN(v)) return;

            if (v > 2) sums[i] += (v - 2);
            else if (v === 1) sums[i] -= 1;

            counts[i]++;
        });
    });

    // SUMME
    sums.forEach((s, i) => {
        let el = document.getElementById("sum" + (i + 1));
        el.innerText = s;
        el.classList.remove("lowest", "highest");
    });

    // Ø
    document.querySelectorAll("#scoreTable tr").forEach(() => {});

    for (let i = 0; i < playerCount; i++) {
        let values = [];

        document.querySelectorAll("#scoreTable tr").forEach(row => {
            let input = row.querySelectorAll("input")[i];
            if (!input) return;

            let v = parseInt(input.value);
            if (!isNaN(v)) values.push(v);
        });

        let avg = values.length ? (values.reduce((a,b)=>a+b,0) / values.length).toFixed(1) : 0;
        document.getElementById("avg" + (i + 1)).innerText = avg;
    }

    // Highlight
    let min = Math.min(...sums);
    let max = Math.max(...sums);

    sums.forEach((s, i) => {
        let el = document.getElementById("sum" + (i + 1));
        if (s === min) el.classList.add("lowest");
        if (s === max) el.classList.add("highest");
    });
}

// SAVE
function saveData() {

    let data = {
        players: playerCount,
        title: courseName.value,
        names: [...document.querySelectorAll("thead input")].map(i => i.value),
        scores: [...document.querySelectorAll("#scoreTable input")].map(i => i.value)
    };

    localStorage.setItem("golf", JSON.stringify(data));
}

// LOAD
function loadData() {

    let d = JSON.parse(localStorage.getItem("golf"));
    if (!d) return;

    playerCount = d.players || playerCount;
    courseName.value = d.title;

    document.querySelectorAll("thead input").forEach((i, x) => {
        i.value = d.names[x] || i.value;
    });

    document.querySelectorAll("#scoreTable input").forEach((i, x) => {
        i.value = d.scores[x] || "";
    });
}

// SHARE
function shareScreenshot() {
    html2canvas(document.getElementById("app")).then(canvas => {
        canvas.toBlob(blob => {
            const file = new File([blob], "minigolf.png", { type: "image/png" });

            if (navigator.share) {
                navigator.share({
                    title: "Minigolf Ergebnis",
                    files: [file]
                });
            } else {
                let a = document.createElement("a");
                a.href = canvas.toDataURL();
                a.download = "minigolf.png";
                a.click();
            }
        });
    });
}

</script>

</body>
</html>
